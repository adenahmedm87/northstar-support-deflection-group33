<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Northstar Support</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="container">
 <h1>Northstar Self-Service Support</h1>
 <p>Get quick help without opening a support ticket.</p>
 <section class="card">
 <h2>Order Status</h2>
 <input id="orderId" placeholder="Example: ORD004">
 <button id="orderBtn">Check Order</button>
 <p id="orderResult"></p>
 </section>
 <section class="card">
 <h2>Stock Availability</h2>
 <input id="product" placeholder="Example: Blue T-Shirt">
 <input id="size" placeholder="Example: M">
 <button id="stockBtn">Check Stock</button>
 <p id="stockResult"></p>
 </section>
 </main>
 <script src="script.js?v=2"></script>
</body>
</html>
